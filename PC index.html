<!DOCTYPE html><html lang="en-GB"><head><meta charset="utf-8"><title>Mermaid Magic English</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:light;--ink:#12456b;--pk:#ff6fb5;--tl:#17b6c4;--gd:#ffc93c;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
*{box-sizing:border-box}body{margin:0;font-family:"Comic Sans MS","Trebuchet MS",sans-serif;color:var(--ink);background:linear-gradient(#b9f0ff,#7fd6e8 55%,#c9a7ff);min-height:100vh}
.w{max-width:760px;margin:auto;padding:12px}
h1{margin:4px 0;text-align:center;font-size:1.7rem;color:#7a2fc0;text-shadow:0 2px #fff}
.bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
button{font:inherit;cursor:pointer;border:0;border-radius:18px;padding:10px 16px;font-weight:bold;color:#fff;background:linear-gradient(var(--pk),#c44fd8);box-shadow:0 4px #8a2f9c}
button.on{background:linear-gradient(var(--tl),#2f8fe0);box-shadow:0 4px #1b5f9c}
button:active{transform:translateY(3px)}
.card{background:#ffffffd9;border-radius:24px;padding:16px;text-align:center;box-shadow:0 6px 20px #0003}
.stat{display:flex;justify-content:space-between;font-weight:bold;padding:0 6px}
.q{font-size:1.3rem;margin:6px}
.pic{height:210px;max-width:100%;object-fit:contain;border-radius:16px;background:#fff}
.opts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.opt{font-size:1.2rem;background:linear-gradient(#ffd86b,#ffab2e);color:#5a3200;box-shadow:0 4px #b37100}
.ok{background:linear-gradient(#7ff0a0,#25c26a)!important;color:#064d20!important}
.bad,.shake{animation:sh .4s}.bad{background:#ffb3b3!important}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m{border:4px solid transparent;border-radius:16px;background:#fff;padding:4px;cursor:pointer}
.m img{height:100px;max-width:100%;object-fit:contain}
.m.sel{border-color:var(--pk)}.m.done{opacity:.85}
.mw{padding:22px 6px;font-size:1.2rem}
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:50px;margin:10px 0;padding:8px;border-radius:14px;background:#e7f9ff;border:3px dashed var(--tl)}
.slot{background:#fff;border-radius:12px;padding:6px 10px;font-size:1.15rem;border:2px solid var(--tl)}
.sp{background:#eee;border-radius:50%;width:44px;height:44px;padding:0;box-shadow:0 3px #999;font-size:1.3rem}
.coll{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px;font-size:1.9rem}
.coll span{filter:grayscale(1) opacity(.3)}.coll span.got{filter:none;animation:pop .6s}
@keyframes pop{50%{transform:scale(1.8) rotate(15deg)}}
.big{font-size:4rem}
.fx{position:fixed;pointer-events:none;font-size:2rem;animation:fl 1.6s forwards;z-index:9}
@keyframes fl{to{transform:translateY(-70vh) rotate(40deg);opacity:0}}
.pat{background:#fff4c2;border-radius:12px;padding:6px;margin:6px 0}
body{background:linear-gradient(#c8f6ff,#5cc8e6 40%,#2a78c8 100%) fixed;position:relative;overflow-x:hidden}
.w{position:relative;z-index:1;padding-bottom:110px}
.card{border:4px solid #fff;box-shadow:0 0 0 4px #17b6c455,0 8px 24px #0a3a6a66;background:#ffffffe6}
h1{color:#fff;text-shadow:0 3px #7a2fc0,0 0 14px #ff9be0;font-size:1.8rem}
.sea{position:fixed;left:0;right:0;bottom:0;height:100px;pointer-events:none;z-index:0;font-size:2.4rem;display:flex;justify-content:space-around;align-items:flex-end;background:linear-gradient(transparent,#1b5fa8 85%)}
.sea i{font-style:normal;animation:sw 3s ease-in-out infinite alternate}@keyframes sw{to{transform:rotate(8deg)}}
.bub{position:fixed;bottom:-30px;border-radius:50%;border:2px solid #fff9;background:#ffffff40;pointer-events:none;z-index:0;animation:up linear infinite}
@keyframes up{to{transform:translateY(-110vh)}}
.flash{position:fixed;inset:0;z-index:20;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:bg .35s steps(1) 6}
@keyframes bg{0%{background:#ffe86655}33%{background:#ff6fb555}66%{background:#6fe3ff55}}
.fb{font-size:2.6rem;font-weight:bold;color:#fff;text-shadow:0 4px #c44fd8,0 0 20px #ffd23c;animation:zoom .5s ease-in-out infinite alternate}
.fs{font-size:3rem;animation:zoom .3s ease-in-out infinite alternate}
@keyframes zoom{from{transform:scale(.8) rotate(-4deg);filter:brightness(1)}to{transform:scale(1.25) rotate(4deg);filter:brightness(1.6)}}
.coll span.got{animation:pop .6s,blink 1.2s 2}
@keyframes blink{50%{filter:drop-shadow(0 0 12px #ffd23c) brightness(1.8)}}

const V=[["catching","He is catching the ball.","He"],["hitting","She is hitting the ball.","She"],["running","She is running.","She"],["skateboarding","She is skateboarding.","She"],["throwing","She is throwing the ball.","She"]];
const S=[["Can we ride our skateboards in the park?"],["Can I throw the ball for your dog?"],["Can we eat some cake, please?"],["Can we go on the train, please?"],["Can I watch television, please?"],["Can we play badminton in the garden?"]];
const TR=["🐚","🧜‍♀️","🐠","🦄","🔱","🐙","🌈","💎"];
let pe=0,st=0,mode=0,vo=null;
const $=id=>document.getElementById(id),sh=a=>[...a].sort(()=>Math.random()-.5);
function pick(){const v=speechSynthesis.getVoices().filter(x=>/en[-_]GB/i.test(x.lang));vo=v.find(x=>/female|serena|kate|martha|hazel|susan|libby|sonia/i.test(x.name))||v[0]||null}
if(window.speechSynthesis){pick();speechSynthesis.onvoiceschanged=pick}
function sayAll(a){if(!window.speechSynthesis)return;speechSynthesis.cancel();setTimeout(()=>a.forEach(x=>{const u=new SpeechSynthesisUtterance(x);u.lang="en-GB";if(vo)u.voice=vo;u.rate=.7;u.pitch=1.15;speechSynthesis.speak(u)}),200)}
function say(t){sayAll([t])}
function fx(){for(let i=0;i<14;i++){const e=document.createElement("div");e.className="fx";e.textContent=sh(["🫧","✨","⭐","🐚","💖","🪸"])[0];e.style.left=Math.random()*90+"vw";e.style.top=(55+Math.random()*40)+"vh";document.body.appendChild(e);setTimeout(()=>e.remove(),1700)}}
function flash(p){const o=document.createElement("div");o.className="flash";o.innerHTML=`<div class="fb">🌟 ${p} 🌟</div><div class="fs">⭐💖🐚✨🌈🧜‍♀️</div>`;document.body.appendChild(o);setTimeout(()=>o.remove(),2200)}
function win(full){pe++;st++;$("pe").textContent=pe;$("st").textContent=st;fx();co();const p=sh(["Good job!","Perfect!"])[0];const a=[];if(full)a.push(full);a.push(p);if(st%3==0)a.push("You found a magic treasure!");sayAll(a)}
function co(){const n=Math.floor(st/3);$("co").innerHTML=TR.map((t,i)=>`<span class="${i<n?"got":""}">${t}</span>`).join("")}
function spk(t){return `<button class="sp" onclick="say(&quot;${t}&quot;)">🔊</button>`}
function setMode(m){mode=m;[0,1,2].forEach(i=>$("b"+i).className=i==m?"on":"");[r0,r1,r2][m]()}
let qi=0,order=[];
function r0(){if(!order.length)order=sh(V);if(qi>=order.length)return fin(0);const c=order[qi],pron=c[2].toLowerCase()=="he"?"he":"she";
const o=sh([c,...sh(V.filter(x=>x!=c)).slice(0,2)]);
$("g").innerHTML=`<div class="q">What is ${pron} doing? ${spk(`What is ${pron} doing?`)}</div><img class="pic" src="${IMG.v[c[0]]}" onclick="say('What is ${pron} doing?')"><div class="pat">${c[2]} is ____ ${spk(c[2]+" is")}</div><div class="opts">${o.map(x=>`<button class="opt" data-w="${x[0]}">${x[0]} 🔊</button>`).join("")}</div><div id="fb" class="q"></div>`;
say(`What is ${pron} doing?`);
document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{say(b.dataset.w);if(b.dataset.w==c[0]){b.classList.add("ok");$("fb").innerHTML=`🎉 ${c[1]} ${spk(c[1])}`;win(c[1]);qi++;setTimeout(r0,7500)}else{b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),500);$("fb").textContent="Try again, little mermaid! 🫧"}})}
let d1=0;
function fin(m){const nx=m<2?`<button onclick="setMode(${m+1})">Next activity ➡️</button>`:`<div class="q">⭐ You did every activity! ⭐</div>`;$("g").innerHTML=`<div class="big">🧜‍♀️🐚💖</div><div class="q">All done! Good job!</div>${nx}`;say(m<2?"All done! Good job!":"You did every activity! Good job!")}
function r1(){if(d1)return fin(1);let sp=null,left=5;const A=sh(V),B=sh(V),cl=["#ff6fb5","#17b6c4","#9b6bff","#ffab2e","#32c76f"];let ci=0;
$("g").innerHTML=`<div class="q">Tap a picture, then its word! ${spk("Tap a picture, then tap its word.")}</div><div class="grid"><div id="L" class="grid" style="grid-template-columns:1fr"></div><div id="R" class="grid" style="grid-template-columns:1fr;align-content:space-around"></div></div>`;
A.forEach(c=>{const d=document.createElement("div");d.className="m";d.innerHTML=`<img src="${IMG.v[c[0]]}">`;d.onclick=()=>{if(d.dataset.d)return;say(c[0]);document.querySelectorAll("#L .m").forEach(x=>x.classList.remove("sel"));d.classList.add("sel");sp=[c,d]};$("L").appendChild(d)});
B.forEach(c=>{const d=document.createElement("div");d.className="m mw";d.textContent=c[0]+" 🔊";d.onclick=()=>{if(d.dataset.d)return;say(c[0]);if(!sp)return;if(sp[0]==c){const col=cl[ci++];[sp[1],d].forEach(x=>{x.dataset.d=1;x.classList.remove("sel");x.classList.add("done");x.style.borderColor=col;x.style.background=col+"33"});sp=null;win(c[1]);if(--left==0)setTimeout(()=>{d1=1;fin(1)},6000)}else{sp[1].classList.add("shake");const z=sp[1];setTimeout(()=>z.classList.remove("shake"),400);say("Try again!")}};$("R").appendChild(d)});say("Tap a picture, then tap its word.")}
let si=0,so=[];
function r2(){if(!so.length)so=sh(S);if(si>=so.length)return fin(2);const s=so[si][0],w=s.split(" "),pic=IMG.s[S.findIndex(x=>x[0]==s)];let n=0;
$("g").innerHTML=`<div class="q">Complete the sentence! ${spk("Complete the sentence.")}</div><img class="pic" src="${pic}"><div class="slots" id="sl"></div><div class="opts" id="ch"></div><button onclick="say('${s.replace(/'/g,"")}')">🔊 Hear it</button>`;
sh(w.map((x,i)=>[x,i])).forEach(([x])=>{const b=document.createElement("button");b.className="opt";b.textContent=x.replace(/\?/,"")+(x.endsWith("?")?"?":"");b.onclick=()=>{if(x==w[n]){say(x.replace("?",""));const e=document.createElement("span");e.className="slot";e.textContent=x;$("sl").appendChild(e);b.remove();n++;if(n==w.length){win(s);$("g").insertAdjacentHTML("beforeend",`<div class="q">🎉 ${s}</div><button onclick="si++;r2()">Next ➡️</button>`)}}else{b.classList.add("shake");setTimeout(()=>b.classList.remove("shake"),400);say("Try again!")}};$("ch").appendChild(b)});say("Complete the sentence.")}
for(let i=0;i<14;i++){const b=document.createElement('div');b.className='bub';const z=8+Math.random()*26;b.style.cssText+=`width:${z}px;height:${z}px;left:${Math.random()*100}vw;animation-duration:${8+Math.random()*10}s;animation-delay:-${Math.random()*12}s`;document.body.appendChild(b)}
[0,1,2].forEach(i=>$("b"+i).onclick=()=>setMode(i));co();setMode(0);
</script></body></html>
